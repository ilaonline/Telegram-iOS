name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"

      - name: Create canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build unsigned IPA
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -euo pipefail

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT=/private/var/tmp/_bazel_containerhost
          cd "$SOURCE_DIR"

          python3 - <<'PY'
          import json
          import os

          path = "build-system/appstore-configuration.json"
          with open(path, encoding="utf-8") as file:
              config = json.load(file)

          config["api_id"] = os.environ["TG_API_ID"]
          config["api_hash"] = os.environ["TG_API_HASH"]
          config["sg_config"] = ""

          with open(path, "w", encoding="utf-8") as file:
              json.dump(config, file, indent="\t")
              file.write("\n")
          PY

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p build/artifacts
          IPA="$(find bazel-out -path '*/bin/Telegram/Telegram.ipa' -type f -print -quit)"
          test -n "$IPA"
          cp "$IPA" build/artifacts/Telegram-X-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-unsigned
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram-X-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
